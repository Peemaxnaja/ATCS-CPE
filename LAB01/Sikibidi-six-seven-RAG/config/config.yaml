# Pipeline Configuration

collection:
  source_directory: "data/sample"
  raw_directory: "data/raw"
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".html"
    - ".txt"
    - ".md"

cleaning:
  raw_directory: "data/raw"
  clean_directory: "data/clean"
  remove_extra_whitespace: true
  remove_urls: false
  min_text_length: 5

metadata:
  chunks_directory: "data/chunks"
  metadata_directory: "data/metadata"
  default_language: "th"
  default_author: "Pipeline System"
  extract_file_stats: true

embedding:
  metadata_directory: "data/metadata"
  embeddings_directory: "data/embeddings"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 16
  device: "cpu"
  dimension: 384



